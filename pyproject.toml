[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wattwise-ai"
version = "1.0.0"
description = "Explainable household energy forecasting and candidate anomaly detection"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24", "scikit-learn>=1.3", "requests>=2.31", "joblib>=1.3"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
app = ["streamlit>=1.32", "plotly>=5.18"]
advanced = ["xgboost>=2.0", "optuna>=3.5", "shap>=0.44"]
notebooks = ["jupyter>=1.0", "ipykernel>=6.29", "matplotlib>=3.8", "seaborn>=0.13"]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
